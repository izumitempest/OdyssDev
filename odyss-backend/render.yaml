services:
  - type: web
    name: odyss-backend
    env: python311
    region: oregon
    plan: free
    branch: main
    repo: https://github.com/Izumitempest/OdyssDev
    buildCommand: |
      pip install -r requirements/base.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:5000 "app:create_app('production')"
    envVars:
      - key: SQLALCHEMY_ENGINE_OPTIONS
        value: '{"connect_args": {"sslmode": "require"}}'
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SQLALCHEMY_POOL_SIZE
        value: 10
      - key: SQLALCHEMY_POOL_TIMEOUT
        value: 20
      - key: SQLALCHEMY_POOL_RECYCLE
        value: 3600
      - key: SQLALCHEMY_MAX_OVERFLOW
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: odyss_db
          property: connectionString
    autoDeploy: true
    healthCheckPath: /api/v1/auth/ping

  - type: pgsql
    name: odyss_db
    region: oregon
    plan: free
    ipAllowList: []
    databaseName: odyss_db
    databaseUser: odyss_user
    databasePassword: FromThe104